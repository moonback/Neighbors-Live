<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .sweep { transform-origin: 100px 100px; animation: spin 4s linear infinite; }
      .ping { transform-origin: 100px 100px; animation: ping 2.4s ease-out infinite; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ping { from { transform: scale(0.3); opacity: 0.8; } to { transform: scale(1); opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5ec8"/>
      <stop offset="0.5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#3d8bff"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <g fill="none" stroke="#7c8cff" stroke-opacity="0.25">
    <circle cx="100" cy="100" r="88"/>
    <circle cx="100" cy="100" r="62"/>
    <circle cx="100" cy="100" r="36" stroke-dasharray="3 4"/>
  </g>
  <circle class="ping" cx="100" cy="100" r="88" fill="none" stroke="#8b5cff" stroke-width="2"/>
  <path class="sweep" d="M100 100 L188 100 A88 88 0 0 0 162 38 z" fill="url(#sw)"/>
  <g>
    <circle cx="48" cy="70" r="4" fill="#ff5ec8"/>
    <circle cx="150" cy="140" r="4" fill="#3d8bff"/>
    <circle cx="140" cy="58" r="3" fill="#22d3a6"/>
    <circle cx="62" cy="150" r="3" fill="#ffb547"/>
  </g>
  <path d="M100 66c-9.4 0-17 7.4-17 16.5C83 95 100 110 100 110s17-15 17-27.5C117 73.4 109.4 66 100 66z" fill="url(#pin)"/>
  <circle cx="100" cy="82" r="6" fill="#fff"/>
</svg>
